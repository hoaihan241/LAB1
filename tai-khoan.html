<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tài khoản của tôi - Mô Hình Việt</title>
  <link rel="icon" href="Images/logo.svg">
  <script src="Scripts/theme.js"></script>
  <link rel="stylesheet" href="Styles/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-in">
      <a href="index.html" class="logo"><img src="Images/logo.svg" alt="Logo Mô Hình Việt" width="36" height="36"><span>Mô Hình Việt</span></a>
      <nav id="nav" aria-label="Menu chính">
        <a href="index.html">Trang chủ</a>
        <a href="index.html#/san-pham">Mô hình</a>
        <a href="#" data-sapco>Sản phẩm khác</a>
           <a href="tin-tuc.html">Tin tức</a>
        <a href="index.html#/lien-he">Liên hệ</a>
      </nav>
      <div class="header-phai">
        <div id="khuTaiKhoan" class="khu-tk"></div>
        <a href="index.html#/gio-hang" class="gio">Giỏ hàng <b id="soLuongGio">0</b></a>
        <button id="nutMenu" class="nut-menu" aria-label="Mở menu">Menu</button>
      </div>
    </div>
  </header>

  <main class="container" id="noiDungTK" hidden>
    <h2>Thông tin tài khoản</h2>
    <form id="formHoSo" class="form">
      <label>Họ và tên <input name="hoTen" required minlength="2" autocomplete="name"></label>
      <label>Email (không đổi được) <input name="email" type="email" readonly></label>
      <label>Số điện thoại <input name="sdt" pattern="0[0-9]{9}" title="Gồm 10 chữ số, bắt đầu bằng 0" inputmode="tel" autocomplete="tel"></label>
      <button class="btn rong2" type="submit">Lưu thông tin</button>
    </form>

    <h2>Đổi mật khẩu</h2>
    <form id="formMatKhau" class="form">
      <label class="rong2">Mật khẩu hiện tại <input name="cu" type="password" required autocomplete="current-password"></label>
      <label>Mật khẩu mới (ít nhất 6 ký tự) <input name="moi" type="password" required minlength="6" autocomplete="new-password"></label>
      <label>Nhập lại mật khẩu mới <input name="nhapLai" type="password" required minlength="6" autocomplete="new-password"></label>
      <button class="btn rong2" type="submit">Đổi mật khẩu</button>
    </form>

    <h2>Đơn hàng của tôi</h2>
    <div class="bang">
      <table>
        <thead><tr><th>Mã đơn</th><th>Sản phẩm</th><th>Tổng</th><th>Trạng thái</th><th></th></tr></thead>
        <tbody id="dsDon"></tbody>
      </table>
    </div>
  </main>

  <footer id="lien-he" class="footer">
    <div class="container">
      <strong>Mô Hình Việt</strong>
      <p>Hotline: 0900 000 000 · Email: lienhe@mohinhviet.example · Thủ Đức, TP. Hồ Chí Minh</p>
    </div>
  </footer>

  <div id="thongBao" class="thong-bao" role="status"></div>
  <script src="Scripts/auth.js"></script>
  <script src="Scripts/app.js"></script>
  <script src="Scripts/tai-khoan.js"></script>
</body>
</html>
