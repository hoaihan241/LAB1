<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập - Mô Hình Việt</title>
  <link rel="icon" href="Images/logo.svg">
  <script src="Scripts/theme.js"></script>
  <link rel="stylesheet" href="Styles/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-in">
      <a href="index.html" class="logo"><img src="Images/logo.svg" alt="Logo Mô Hình Việt" width="36" height="36"><span>Mô Hình Việt</span></a>
      <nav id="nav" aria-label="Menu chính">
        <a href="index.html">Trang chủ</a>
        <a href="index.html#/san-pham">Mô hình</a>
        <a href="#" data-sapco>Sản phẩm khác</a>
           <a href="tin-tuc.html">Tin tức</a>
        <a href="index.html#/lien-he">Liên hệ</a>
      </nav>
      <div class="header-phai">
        <div id="khuTaiKhoan" class="khu-tk"></div>
        <a href="index.html#/gio-hang" class="gio">Giỏ hàng <b id="soLuongGio">0</b></a>
        <button id="nutMenu" class="nut-menu" aria-label="Mở menu">Menu</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="khung-tk">
      <div class="tabs" role="tablist">
        <button type="button" class="tab-nut hien" data-tab="dn">Đăng nhập</button>
        <button type="button" class="tab-nut" data-tab="dk">Đăng ký</button>
      </div>

      <form id="formDangNhap" class="form">
        <label class="rong2">Email <input name="email" type="email" required autocomplete="email"></label>
        <label class="rong2">Mật khẩu <input name="matKhau" type="password" required autocomplete="current-password"></label>
        <button class="btn rong2" type="submit">Đăng nhập</button>
        <p id="loiDN" class="loi-tk rong2" role="alert" hidden></p>
      </form>

      <form id="formDangKy" class="form" hidden>
        <label class="rong2">Họ và tên <input name="hoTen" required minlength="2" autocomplete="name"></label>
        <label class="rong2">Email <input name="email" type="email" required autocomplete="email"></label>
        <label class="rong2">Số điện thoại (không bắt buộc) <input name="sdt" pattern="0[0-9]{9}" title="Gồm 10 chữ số, bắt đầu bằng 0" inputmode="tel" autocomplete="tel"></label>
        <label class="rong2">Mật khẩu (ít nhất 6 ký tự) <input name="matKhau" type="password" required minlength="6" autocomplete="new-password"></label>
        <label class="rong2">Nhập lại mật khẩu <input name="nhapLai" type="password" required minlength="6" autocomplete="new-password"></label>
        <button class="btn rong2" type="submit">Tạo tài khoản</button>
        <p id="loiDK" class="loi-tk rong2" role="alert" hidden></p>
      </form>
    </div>
  </main>

  <footer id="lien-he" class="footer">
    <div class="container">
      <strong>Mô Hình Việt</strong>
      <p>Hotline: 0900 000 000 · Email: lienhe@mohinhviet.example · Thủ Đức, TP. Hồ Chí Minh</p>
    </div>
  </footer>

  <div id="thongBao" class="thong-bao" role="status"></div>
  <script src="Scripts/auth.js"></script>
  <script src="Scripts/app.js"></script>
  <script src="Scripts/dang-nhap.js"></script>
</body>
</html>
